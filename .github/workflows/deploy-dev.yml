name: Deploy Analytics DEV

on:
  workflow_run:
    workflows: ["Analytics CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      PLATFORM_ENVIRONMENT_ID: 398c3cfb-d7c7-4aaf-b5a4-3b44d3087451
      ANALYTICS_SERVICE: analytics
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Check out tested Analytics revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Verify Railway project token scope
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_TOKEN:-}" ] || { echo '::error::RAILWAY_TOKEN is not configured.'; exit 1; }
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          request = Request(
              "https://backboard.railway.com/graphql/v2",
              data=json.dumps({
                  "query": "query { projectToken { projectId environmentId } }"
              }).encode(),
              headers={
                  "Content-Type": "application/json",
                  "Project-Access-Token": os.environ["RAILWAY_TOKEN"],
              },
              method="POST",
          )
          try:
              with urlopen(request, timeout=20) as response:
                  payload = json.load(response)
          except HTTPError as exc:
              raise SystemExit(
                  f"Railway rejected RAILWAY_TOKEN (HTTP {exc.code}); "
                  "expected a project token for the Analytics DEV environment"
              ) from None
          except URLError as exc:
              raise SystemExit(f"Could not reach Railway token verification endpoint: {exc.reason}") from None

          if payload.get("errors"):
              raise SystemExit("Railway project-token scope query failed")

          scope = payload.get("data", {}).get("projectToken") or {}
          expected = {
              "projectId": os.environ["PLATFORM_PROJECT_ID"],
              "environmentId": os.environ["PLATFORM_ENVIRONMENT_ID"],
          }
          if scope != expected:
              raise SystemExit(
                  "RAILWAY_TOKEN targets a different Railway project/environment "
                  f"(project={scope.get('projectId')}, environment={scope.get('environmentId')})"
              )

          print("RAILWAY_PROJECT_TOKEN_SCOPE=PASS|project=verigence-audit-core|environment=dev")
          PY
      - name: Deploy Analytics using the scoped project token
        run: |
          set -euo pipefail
          railway up . --path-as-root --service "$ANALYTICS_SERVICE" --ci --yes --message "Analytics DEV ${DEPLOY_SHA}"
          echo "ANALYTICS_DEPLOYMENT=PASS"
      - name: Railway failure diagnostics
        if: failure()
        run: |
          railway logs --service "$ANALYTICS_SERVICE" --build --lines 220 || true
          railway logs --service "$ANALYTICS_SERVICE" --deployment --lines 220 || true
      - name: Smoke test Analytics
        run: |
          set -euo pipefail
          base="https://analytics-dev.up.railway.app"
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 3 --max-time 15 "$base/health"
          echo
          echo "ANALYTICS_PUBLIC_HEALTH=PASS|$base"
