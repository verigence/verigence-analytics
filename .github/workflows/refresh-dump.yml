name: Refresh Analytics Dump

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: Exact Verigence Tenant / Audit Project ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: analytics-dump-${{ inputs.tenant_id }}
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      PLATFORM_ENVIRONMENT_ID: 398c3cfb-d7c7-4aaf-b5a4-3b44d3087451
      ANALYTICS_SERVICE: analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Analytics and Railway CLI
        run: |
          python -m pip install -e .
          npm install --global @railway/cli
      - name: Link Analytics service
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::RAILWAY_API_TOKEN is not configured.'; exit 1; }
          env -u RAILWAY_TOKEN railway link --project "$PLATFORM_PROJECT_ID" --environment "$PLATFORM_ENVIRONMENT_ID" --service "$ANALYTICS_SERVICE" --json >/dev/null
      - name: Create controlled dump
        run: |
          set -euo pipefail
          env -u RAILWAY_TOKEN railway run --service "$ANALYTICS_SERVICE" python -m analytics.dump_cli --tenant '${{ inputs.tenant_id }}' --requested-by 'github-actions'
